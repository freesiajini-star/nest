<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEST</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;background:#f5f6f8;color:#20242a}
button{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid #e5e7eb;padding:26px 14px;z-index:10}
.logo{padding:0 14px 26px}
.logo-title{font-size:20px;font-weight:750;letter-spacing:-.6px}
.logo-sub{margin-top:5px;font-size:12px;color:#9aa0a6}
.menu-title{padding:0 14px;margin:18px 0 7px;font-size:11px;color:#a0a5ad;font-weight:700}
.menu-button{width:100%;border:0;background:transparent;padding:10px 14px;margin:2px 0;border-radius:9px;text-align:left;font-size:14px;color:#555b64;cursor:pointer}
.menu-button:hover{background:#f4f5f7}
.menu-button.active{background:#eef2f7;color:#20242a;font-weight:700}
.main{width:calc(100% - 220px);margin-left:220px;min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 38px}
.page-title{font-size:22px;font-weight:750;letter-spacing:-.7px}
.update{font-size:12px;color:#9aa0a6}
.content{padding:30px 38px 60px;max-width:1500px;margin:auto}
.page-intro{margin-bottom:24px}.page-intro h1{margin:0;font-size:27px;letter-spacing:-1px}.page-intro p{margin:7px 0 0;color:#8b9199;font-size:14px}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.summary-card,.card{background:#fff;border:1px solid #e6e8eb;border-radius:14px}
.summary-card{padding:20px}.summary-label{font-size:13px;color:#8b9199;margin-bottom:10px}.summary-value{font-size:25px;font-weight:750;letter-spacing:-.7px}.summary-change{margin-top:7px;font-size:12px;color:#7b828b}
.grid-2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.card{padding:22px;min-width:0}.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card-title{font-size:16px;font-weight:700}.muted{font-size:12px;color:#9aa0a6}
.chart{height:245px;border-left:1px solid #eceef0;border-bottom:1px solid #eceef0;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 24%,#f0f1f3 25%,transparent 26%)}
.chart svg{position:absolute;inset:22px 15px 28px 20px;width:calc(100% - 35px);height:calc(100% - 50px)}
.axis{display:flex;justify-content:space-between;padding:8px 4% 0;color:#a0a5ad;font-size:11px}
.donut-wrap{min-height:245px;display:flex;align-items:center;justify-content:center;gap:30px}.donut{width:165px;height:165px;border-radius:50%;background:conic-gradient(#34495e 0 41%,#8796a5 41% 65%,#c5ccd3 65% 90%,#e4e7ea 90% 100%);position:relative;flex-shrink:0}.donut:after{content:"";position:absolute;width:92px;height:92px;background:#fff;border-radius:50%;left:36.5px;top:36.5px}
.legend{display:flex;flex-direction:column;gap:13px}.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#626871}.dot{width:9px;height:9px;border-radius:50%;background:#34495e}.legend-item:nth-child(2) .dot{background:#8796a5}.legend-item:nth-child(3) .dot{background:#c5ccd3}.legend-item:nth-child(4) .dot{background:#e4e7ea}
.bars{height:245px;display:flex;align-items:flex-end;gap:18px;padding:10px 14px 0;border-bottom:1px solid #eceef0}.month{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:5px}.bar{width:14px;border-radius:4px 4px 0 0}.income{background:#6f8194}.expense{background:#c8cdd3}.months{display:flex;justify-content:space-around;padding-top:8px;color:#a0a5ad;font-size:11px}
.alloc{min-height:245px}.alloc-row{margin-bottom:21px}.alloc-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.track{height:10px;background:#edf0f2;border-radius:10px;overflow:hidden}.fill{height:100%;background:#536779;border-radius:10px}.target{font-size:11px;color:#9aa0a6;margin-top:5px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:20px}.list{display:flex;flex-direction:column}.item{padding:14px 0;border-bottom:1px solid #eef0f2;display:flex;justify-content:space-between;gap:20px}.item:last-child{border-bottom:0}.item-title{font-size:13px}.item-desc{margin-top:4px;font-size:11px;color:#999fa7}.item-value{white-space:nowrap;font-size:12px;color:#737a83}
.section-title{font-size:14px;font-weight:700;margin:25px 0 12px}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:13px 8px;border-bottom:1px solid #eef0f2;text-align:left}.table th{color:#8b9199;font-size:11px;font-weight:600}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:11px;color:#56616d}
.empty{padding:70px 20px;text-align:center;color:#8b9199;background:#fff;border:1px solid #e6e8eb;border-radius:14px}

/* 설정형 대시보드 */
.chart-control{display:flex;align-items:center;gap:7px}
.select-control{border:1px solid #e1e4e8;background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;color:#555b64;cursor:pointer}
.manage-button{border:1px solid #e1e4e8;background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;color:#555b64;cursor:pointer}
.manage-button:hover,.select-control:hover{background:#f6f7f8}
.education-summary{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-top:14px}
.education-mini{background:#f7f8fa;border-radius:10px;padding:14px}
.education-mini-label{font-size:11px;color:#8b9199}
.education-mini-value{font-size:19px;font-weight:750;margin-top:5px}
.education-child{margin-top:14px;padding-top:14px;border-top:1px solid #eef0f2}
.education-child-row{display:flex;justify-content:space-between;font-size:12px;margin:7px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,25,30,.32);display:none;align-items:center;justify-content:center;z-index:100}
.modal-backdrop.show{display:flex}
.modal{width:min(560px,calc(100vw - 32px));max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:750}
.close-button{border:0;background:#f2f3f5;border-radius:50%;width:30px;height:30px;cursor:pointer}
.manage-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #eef0f2}
.manage-row span{font-size:13px}
.small-button{border:1px solid #e1e4e8;background:#fff;border-radius:7px;padding:6px 9px;font-size:11px;cursor:pointer}
.add-row{display:flex;gap:8px;margin-top:16px}
.add-row input{flex:1;border:1px solid #dfe3e7;border-radius:8px;padding:9px 10px}
.add-row button{border:0;background:#536779;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}
.modal-note{font-size:11px;color:#999fa7;margin-top:14px;line-height:1.6}
@media(max-width:700px){.education-summary{grid-template-columns:1fr}.chart-control{gap:4px}}

@media(max-width:1000px){.sidebar{width:190px}.main{width:calc(100% - 190px);margin-left:190px}.content{padding:25px}.summary-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.bottom{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:14px;border-right:0;border-bottom:1px solid #e5e7eb}.logo{padding:4px 10px 12px}.menu-title{display:none}.menu-section{display:flex;overflow-x:auto;padding-bottom:4px;margin:3px 0}.menu-button{width:auto;white-space:nowrap;margin-right:4px}.main{width:100%;margin-left:0}.topbar{padding:0 18px}.update{display:none}.content{padding:20px 15px 40px}.summary-grid{gap:10px}.summary-card{padding:16px}.summary-value{font-size:20px}.donut-wrap{flex-direction:column;gap:20px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><div class="logo-title">NEST</div><div class="logo-sub">Family Financial OS</div></div>

  <div class="menu-title">재무</div>
  <button class="menu-button active" data-page="전체">전체</button>
  <button class="menu-button" data-page="병원">병원</button>
  <button class="menu-button" data-page="남편">남편</button>
  <button class="menu-button" data-page="나">나</button>
  <button class="menu-button" data-page="가정">가정</button>
  <button class="menu-button" data-page="교육비">교육비</button>

  <div class="menu-title">자산 관리</div>
  <button class="menu-button" data-page="투자">투자</button>
  <button class="menu-button" data-page="보험">보험</button>
  <button class="menu-button" data-page="연금">연금</button>
  <button class="menu-button" data-page="자산">자산</button>

  <div class="menu-title">관리</div>
  <button class="menu-button" data-page="거래">거래</button>
  <button class="menu-button" data-page="물품">물품</button>

  <div class="menu-title">시스템</div>
  <button class="menu-button" data-page="설정">설정</button>
</aside>

<main class="main">
  <header class="topbar">
    <div class="page-title" id="pageTitle">전체</div>
    <div class="update">마지막 업데이트 2026.09.30 10:20</div>
  </header>
  <section class="content" id="content"></section>
</main>
</div>


<div class="modal-backdrop" id="assetModal" onclick="if(event.target===this)closeModal('assetModal')">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">자산 구성 항목 관리</div><button class="close-button" onclick="closeModal('assetModal')">×</button></div>
    <div id="assetRows"></div>
    <div class="add-row"><input id="newAssetName" placeholder="새 자산 항목 이름"><button onclick="addAsset()">추가</button></div>
    <div class="modal-note">항목을 추가하면 향후 연결된 계좌·자산을 해당 항목으로 분류할 수 있습니다.</div>
  </div>
</div>

<div class="modal-backdrop" id="educationModal" onclick="if(event.target===this)closeModal('educationModal')">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">교육비 항목 관리</div><button class="close-button" onclick="closeModal('educationModal')">×</button></div>
    <div id="educationRows"></div>
    <div class="add-row"><input id="newEducationName" placeholder="새 교육비 항목 이름"><button onclick="addEducation()">추가</button></div>
    <div class="modal-note">예: 학원, 바이올린, 수영, 피아노, 교재, 대회·콩쿠르 등 원하는 항목으로 구성할 수 있습니다.</div>
  </div>
</div>

<script>
const data = {
  전체: `
    <div class="page-intro"><h1>우리 가족의 재무 현황</h1><p>2026년 9월 30일 기준</p></div>
    <div class="summary-grid">

    </div>
    <div class="grid-2">
      <div class="card">${headerWithControl("순자산 추이", `<select class="select-control" id="netWorthPeriod" onchange="changeNetWorthPeriod(this.value)">
      <option value="3">최근 3개월</option>
      <option value="6">최근 6개월</option>
      <option value="9" selected>최근 9개월</option>
      <option value="12">최근 1년</option>

        <div class="chart"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><polyline points="0,150 70,143 140,138 210,125 280,130 350,108 420,95 500,72 600,45" fill="none" stroke="#536779" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="45" r="6" fill="#536779"/></svg></div>
        <div class="axis"><span>1월</span><span>3월</span><span>5월</span><span>7월</span><span>9월</span></div>

      <div class="card">${headerWithControl("자산 구성", `<button class="manage-button" onclick="openAssetManager()">항목 관리</button>`)}

    </div>
    <div class="grid-2">

          ${barGroup(78,52)}${barGroup(72,49)}${barGroup(84,58)}${barGroup(76,54)}${barGroup(91,61)}${barGroup(88,57)}
        </div><div class="months"><span>4월</span><span>5월</span><span>6월</span><span>7월</span><span>8월</span><span>9월</span></div>
      </div>
      <div class="card">${header("투자 현황","목표 대비 현재")}
        <div class="alloc">
          ${allocation("주식",52,"목표 40% · 현재 +12%p")}
          ${allocation("채권",12,"목표 20% · 현재 -8%p")}
          ${allocation("현금·예금",20,"목표 20% · 현재 ±0%p")}
          ${allocation("기타",16,"목표 20% · 현재 -4%p")}
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        ${headerWithControl("교육비","학령기 자녀 2명")}
        <div class="education-summary">
          <div class="education-mini">
            <div class="education-mini-label">이번 달</div>
            <div class="education-mini-value">128만원</div>
          </div>
          <div class="education-mini">
            <div class="education-mini-label">올해 누적</div>
            <div class="education-mini-value">1,086만원</div>
          </div>

        <div class="list">${notice("순자산이 증가했습니다","전월 대비 순자산 +280만원","+280만")}${notice("병원 지출이 증가했습니다","의약품 구매액이 전월보다 증가","+42만")}${notice("투자 비중이 변했습니다","주식 비중이 목표보다 높아졌습니다","+12%p")}</div>

      </div>
    </div>`,

  병원: page("병원 운영 현황","병원의 매출·지출·물품 흐름을 한눈에 확인합니다.",[
    ["이번 달 매출","3,420만원","전월 대비 +3.8%"],

  ],`

    <div class="card">${header("구매 예정 물품","Google Sheets 연동 예정")}<table class="table"><tr><th>품목</th><th>최근 구매</th><th>평균 주기</th><th>예상 구매</th></tr><tr><td>의약품 A</td><td>09/12</td><td>43일</td><td><span class="pill">10/25 예상</span></td></tr><tr><td>소모품 B</td><td>09/18</td><td>31일</td><td><span class="pill">10/19 예상</span></td></tr><tr><td>주사기</td><td>09/22</td><td>28일</td><td><span class="pill">10/20 예상</span></td></tr></table></div>`),

  남편: personalPage("남편","남편 개인의 수입·지출·투자·자산 현황입니다."),
  나: personalPage("나","내 개인의 수입·지출·투자·자산 현황입니다."),

    ["올해 누적","1,086만원","2026년 누계"],
    ["첫째","63만원","이번 달"],
    ["둘째","65만원","이번 달"]
  ],`
    <div class="grid-2">
      <div class="card">${headerWithControl("월별 교육비","2026년")}
        <div class="chart"><svg viewBox="0 0 600 180" preserveAspectRatio="none">
          <polyline points="0,150 70,142 140,130 210,125 280,112 350,105 420,90 500,78 600,62" fill="none" stroke="#536779" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

function card(label,value,change){return `<div class="summary-card"><div class="summary-label">${label}</div><div class="summary-value">${value}</div><div class="summary-change">${change}</div></div>`}
function header(title,sub=""){return `<div class="card-header"><div class="card-title">${title}</div><div class="muted">${sub}</div></div>`}
function notice(title,desc,value){return `<div class="item"><div><div class="item-title">${title}</div><div class="item-desc">${desc}</div></div><div class="item-value">${value}</div></div>`}
function allocation(label,value,target){return `<div class="alloc-row"><div class="alloc-head"><span>${label}</span><b>${value}%</b></div><div class="track"><div class="fill" style="width:${value}%"></div></div><div class="target">${target}</div></div>`}
function barGroup(i,e){return `<div class="month"><div class="bar income" style="height:${i}%"></div><div class="bar expense" style="height:${e}%"></div></div>`}
function page(title,desc,stats,body){return `<div class="page-intro"><h1>${title}</h1><p>${desc}</p></div>${stats.length?`<div class="summary-grid">${stats.map(x=>card(...x)).join("")}</div>`:""}${body}`}
function personalPage(title,desc){return page(title,desc,[["이번 달 수입","620만원","현재 기준"],["이번 달 지출","280만원","전월 대비 -3.2%"],["투자자산","1.12억원","현재 평가액"],["순자산","2.36억원","현재 기준"]],`<div class="grid-2"><div class="card">${header("월별 현금흐름","최근 6개월")}<div class="chart"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><polyline points="0,140 100,128 200,120 300,102 400,86 500,70 600,55" fill="none" stroke="#536779" stroke-width="4"/></svg></div></div><div class="card">${header("자산 구성","현재")}<div class="donut-wrap"><div class="donut"></div><div class="legend"><div class="legend-item"><span class="dot"></span>투자 47%</div><div class="legend-item"><span class="dot"></span>예금 28%</div><div class="legend-item"><span class="dot"></span>연금 15%</div><div class="legend-item"><span class="dot"></span>기타 10%</div></div></div></div></div>`)}
function render(pageName){
  document.getElementById("pageTitle").textContent=pageName;
  document.getElementById("content").innerHTML=data[pageName]||data.전체;
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".menu-button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".menu-button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.page);
  });
});

function headerWithControl(title, control=""){return `<div class="card-header"><div class="card-title">${title}</div><div class="chart-control">${control}</div></div>`}

function closeModal(id){document.getElementById(id).classList.remove("show")}
function renderAssetRows(){
  document.getElementById("assetRows").innerHTML=assetItems.map((x,i)=>`<div class="manage-row"><span>${x}</span><button class="small-button" onclick="renameAsset(${i})">수정</button><button class="small-button" onclick="deleteAsset(${i})">삭제</button></div>`).join("");
}
function renderEducationRows(){
  document.getElementById("educationRows").innerHTML=educationItems.map((x,i)=>`<div class="manage-row"><span>${x}</span><button class="small-button" onclick="renameEducation(${i})">수정</button><button class="small-button" onclick="deleteEducation(${i})">삭제</button></div>`).join("");
}
function addAsset(){
  const input=document.getElementById("newAssetName"); const name=input.value.trim();
  if(!name)return; if(assetItems.includes(name)){alert("이미 있는 항목입니다.");return}
  assetItems.push(name);input.value="";renderAssetRows();
}
function deleteAsset(i){if(confirm(`"${assetItems[i]}" 항목을 삭제할까요?`)){assetItems.splice(i,1);renderAssetRows()}}
function renameAsset(i){const n=prompt("항목 이름",assetItems[i]);if(n&&n.trim()){assetItems[i]=n.trim();renderAssetRows()}}
function addEducation(){
  const input=document.getElementById("newEducationName"); const name=input.value.trim();
  if(!name)return; if(educationItems.includes(name)){alert("이미 있는 항목입니다.");return}
  educationItems.push(name);input.value="";renderEducationRows();
}
function deleteEducation(i){if(confirm(`"${educationItems[i]}" 항목을 삭제할까요?`)){educationItems.splice(i,1);renderEducationRows()}}
function renameEducation(i){const n=prompt("항목 이름",educationItems[i]);if(n&&n.trim()){educationItems[i]=n.trim();renderEducationRows()}}
function changeNetWorthPeriod(period){
  const labels={3:["7월","8월","9월"],6:["4월","5월","6월","7월","8월","9월"],9:["1월","2월","3월","4월","5월","6월","7월","8월","9월"],12:["2025.10","2025.11","2025.12","2026.01","2026.02","2026.03","2026.04","2026.05","2026.06","2026.07","2026.08","2026.09"],36:["2024","2025","2026"],60:["2022","2023","2024","2025","2026"],120:["2017","2019","2021","2023","2025","2026"],all:["전체 기간"]};
  const text=labels[period]||labels[9];
  alert(`${period==="all"?"전체 기간":period+"개월"} 데이터로 그래프가 전환됩니다.\n\n현재는 테스트 화면이며, Firebase 연결 후 실제 월별 데이터가 표시됩니다.`);
}
